* { box-sizing: border-box; }
html.is-splash { overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
::selection { background: var(--accent); color: var(--accent-ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap {
  width: 100%; max-width: 1080px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

  position: fixed; inset: 0; z-index: 100;
  display: grid; overflow: hidden; cursor: pointer;
}
.splash.gone { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s ease, visibility 0s linear .35s; }
.splash.play { animation: splashEnd 1ms linear calc(var(--open) + 1.1s) forwards; }
@keyframes splashEnd { to { visibility: hidden; pointer-events: none; } }

.door {
  position: absolute; top: 0; bottom: 0; width: 50.4%; z-index: 2; will-change: transform;
  background: radial-gradient(120% 70% at 50% 100%, #14120d 0%, var(--bg) 70%);
}
.door.l { left: 0; border-right: 1px solid rgba(251, 203, 105, .45); }
.door.r { right: 0; border-left: 1px solid rgba(251, 203, 105, .45); }
.splash.play .door.l { animation: doorL 1s cubic-bezier(.76, 0, .24, 1) var(--open) forwards; }
.splash.play .door.r { animation: doorR 1s cubic-bezier(.76, 0, .24, 1) var(--open) forwards; }
@keyframes doorL { to { transform: translateX(-101%); } }
@keyframes doorR { to { transform: translateX(101%); } }

.seam {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; z-index: 3; opacity: .55;
  background: linear-gradient(to bottom, transparent, var(--accent) 30%, var(--accent) 70%, transparent);
}
.splash.play .seam { animation: seamIn 1s cubic-bezier(.6, 0, .2, 1) .9s both, seamOut .25s ease calc(var(--open) - .1s) forwards; }
@keyframes seamIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes seamOut { to { opacity: 0; } }

.scene {
  position: absolute; inset: 0; z-index: 4; display: grid; grid-template-rows: minmax(0, 1fr) auto;
  justify-items: center;
}
.splash.play .scene { animation: sceneOut .6s cubic-bezier(.5, 0, .75, .2) calc(var(--open) - .3s) forwards; }
@keyframes sceneOut { to { opacity: 0; transform: scale(1.05); } }

.skip {
  position: absolute; z-index: 5; cursor: pointer;
  top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
  background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--muted);
  font: 500 11px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; padding: 9px 14px 8px;
  transition: color .2s, border-color .2s;
}
.skip:hover { color: var(--accent); border-color: var(--accent); }
.splash.play .skip { animation: fade .6s ease 1s both; }

.stage { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 80px 16px 12px; }

.logo-wrap { position: relative; width: min(66vw, 360px); }
.glow {
  position: absolute; inset: -55% -30%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(251, 203, 105, .17), transparent 72%);
}
.splash.play .glow { animation: glow 2.4s ease .5s both; }
@keyframes glow { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

.steam { position: absolute; left: 0; right: 0; bottom: 100%; width: 100%; height: auto; margin-bottom: 4px; overflow: visible; pointer-events: none; }
.steam path {
  fill: none; stroke: var(--fg); stroke-width: 2.6; stroke-linecap: round;
  stroke-dasharray: 46 100; stroke-dashoffset: 46; opacity: 0;
}
.splash.play .steam path { animation: steam 2.9s ease-in-out infinite; animation-delay: calc(1.15s + var(--k) * .42s); }
@keyframes steam {
  0% { stroke-dashoffset: 46; opacity: 0; }
  25% { opacity: .55; }
  75% { opacity: .3; }
  100% { stroke-dashoffset: -100; opacity: 0; }
}

.logo { position: relative; width: 100%; aspect-ratio: 1188 / 669; }
.ltr {
  position: absolute; top: 0; height: 100%; background: var(--fg);
  -webkit-mask-image: var(--m); mask-image: var(--m);
  -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  transform-origin: 50% 100%;
}
.splash.play .ltr { animation: rise .95s cubic-bezier(.34, 1.45, .64, 1) calc(.35s + var(--i) * .11s) both; }

@keyframes rise {
  0% { opacity: 0; transform: translateY(75%) rotate(var(--r)) scaleY(1.25); }
  40% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}

.rule { width: 44%; height: 3px; border-radius: 2px; background: var(--accent); transform-origin: left; }
.splash.play .rule { animation: rule .7s cubic-bezier(.6, 0, .2, 1) 1.55s both; }
@keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.tag-line { margin: 0; font: 400 clamp(18px, 4.8vw, 24px)/1 var(--display); letter-spacing: .2em; text-transform: uppercase; text-align: center; }
.tag-line b { font-weight: 400; color: var(--accent); }
.splash.play .tag-line { animation: track 1.5s cubic-bezier(.2, .7, .2, 1) 1.75s both; }
@keyframes track { from { letter-spacing: .6em; opacity: 0; } to { letter-spacing: .2em; opacity: 1; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.load { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px; }
.bar { display: block; width: 150px; height: 2px; background: var(--line-strong); overflow: hidden; border-radius: 2px; }
.bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.splash.play .bar i { animation: fill 3s cubic-bezier(.45, .05, .3, 1) .7s both; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.lbl { font: 500 10.5px/1 var(--body); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
.splash.play .load { animation: fade .6s ease 1.2s both; }

.art { width: 100%; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.art img {
  display: block; height: auto; width: min(100vw, 560px, 46vh);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
}
.splash.play .art img { animation: artIn 1.5s cubic-bezier(.2, .7, .2, 1) 1.35s both; }
@keyframes artIn { from { clip-path: inset(100% 0 0 0); transform: translateY(24px); } to { clip-path: inset(0); transform: none; } }
@media (max-height: 560px) { .art { display: none; } .stage { padding-top: 56px; } }

/* ---------- Reveal after the doors open ---------- */
.reveal { animation: up 1s cubic-bezier(.2, .7, .2, 1) calc(var(--open) + var(--d, 0s)) both; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
html.skipped .reveal, html.skipped .hero img { animation: none; }

/* ---------- Hero ---------- */
.hero { max-width: 940px; margin-inline: auto; overflow: hidden; }
.hero img { display: block; width: 100%; height: auto; animation: heroIn 2s cubic-bezier(.2, .7, .2, 1) var(--open) both; }
@keyframes heroIn { from { transform: scale(1.08); } to { transform: none; } }

.ticker { overflow: hidden; border-block: 1px solid var(--line); background: var(--surface); }
.track {
  display: flex; align-items: center; gap: 28px; width: max-content; padding-block: 14px;
  font: 400 clamp(22px, 5vw, 30px)/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
  animation: slide 48s linear infinite;
}
.track span { white-space: nowrap; }
.track span:nth-child(4n+1) { color: var(--accent); }
.track i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
@keyframes slide { to { transform: translateX(-50%); } }

/* ---------- Rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(0, 0, 0, .88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.rail-row { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.mark { display: block; aspect-ratio: 1188 / 669; -webkit-mask: var(--whole) center / contain no-repeat; mask: var(--whole) center / contain no-repeat; }
.mark.mini { width: 56px; background: var(--fg); flex: none; display: none; }
.chips {
  flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent 100%);
  mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent 100%);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; cursor: pointer; background: transparent; border: 1px solid var(--line-strong); color: var(--fg);
  font: 400 19px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 15px 8px; border-radius: 999px;
  transition: background .2s, color .2s, border-color .2s;
}
.chip:hover { border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 8px; }
.chip .ic { width: 22px; margin: 0; transform: none; stroke-width: 3.4; }
.chip.on .ic { color: var(--accent-ink); }
.chip.on .ic .a { fill: var(--accent-ink); }
.chip.on .ic .b { fill: var(--accent); }
.chip.on .ic .s { stroke: var(--accent-ink); }
.chip.on .ic .k { stroke: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sbtn {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
  background: transparent; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--fg);
}
.sbtn:hover, .rail.searching .sbtn { border-color: var(--accent); color: var(--accent); }
.sbtn svg { width: 18px; height: 18px; }
.search { display: none; padding-bottom: 12px; }
.rail.searching .search { display: block; }
.field {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 12px; padding: 0 12px;
}
.field:focus-within { border-color: var(--accent); }
.field svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.field input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg);
  font: 400 16px/1.2 var(--body); padding: 13px 0;
}
.field input::placeholder { color: var(--muted); }
.field input::-webkit-search-cancel-button { display: none; }

/* ---------- Menu ---------- */
.cat { padding-top: 52px; scroll-margin-top: calc(var(--rail-h) + env(safe-area-inset-top, 0px) + 4px); }
.cat-h {
  position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.cat-h::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 64px; height: 3px; background: var(--accent); }
.ttl { display: flex; align-items: flex-end; gap: 12px; min-width: 0; }
.ttl h2 { margin: 0; font: 400 clamp(46px, 10vw, 76px)/.9 var(--display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.ic { flex: none; display: block; width: clamp(54px, 13vw, 80px); aspect-ratio: 1; color: var(--fg); margin-bottom: 2px; transform: rotate(-5deg);
  fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.ic .a { fill: var(--accent); }
.ic .b { fill: var(--bg); }
.ic .s { stroke: var(--accent); }
.ic .k { stroke: var(--accent-ink); }
.cat-n { font: 500 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; padding-bottom: 6px; margin-left: auto; }
.sub { margin: 12px 0 0; font: 500 12px/1.3 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; column-gap: 56px; }
.item {
  display: grid; grid-template-columns: 68px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
  padding-block: 14px; border-bottom: 1px solid var(--line);
}
.item-art {
  width: 68px; height: 68px; display: grid; place-items: center; border: 1px solid var(--line-strong);
  border-radius: 14px; background: radial-gradient(circle at 50% 35%, rgba(251, 203, 105, .12), transparent 68%), var(--surface);
  color: var(--fg); overflow: hidden; transition: transform .25s ease, border-color .25s ease, background .25s ease;
}
.item:hover .item-art { transform: translateY(-2px) rotate(-2deg); border-color: var(--accent); background: radial-gradient(circle at 50% 35%, rgba(251, 203, 105, .2), transparent 70%), var(--surface); }
.item-art svg { width: 58px; height: 58px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.item-art .a { fill: var(--accent); stroke: var(--accent); }
.item-art .b { fill: var(--bg); }
.item-art .s { stroke: var(--accent); }
.item-art .k { stroke: var(--accent-ink); }
.info { min-width: 0; }
.item h3 { margin: 0; font: 400 24px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.note { font: 500 11.5px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.item p { margin: 6px 0 0; max-width: 46ch; font-size: 14px; line-height: 1.55; color: var(--muted); }
.price { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-variant-numeric: tabular-nums; }
.price b { font: 400 25px/1.1 var(--display); letter-spacing: .03em; color: var(--accent); }
.price span { display: flex; align-items: baseline; gap: 10px; }
.price small { font: 500 10.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.item.off h3 > span:first-child, .item.off .price, .item.off p { opacity: .45; }
.item.off .price b { text-decoration: line-through; }
.off-tag { border: 1px solid var(--line-strong); border-radius: 3px; padding: 3px 6px 2px; color: var(--muted); }
.empty { padding: 72px 0 24px; text-align: center; color: var(--muted); }
.empty strong { color: var(--fg); }
.empty button { margin-top: 14px; cursor: pointer; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 9px 18px; font: 500 14px/1 var(--body); }

/* ---------- Footer ---------- */
.foot { margin-top: 72px; border-top: 1px solid var(--line); padding-block: 48px 56px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.foot img { display: block; width: min(100%, 440px); height: auto; margin-bottom: 8px;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent); }
.foot .mark { width: 110px; background: var(--accent); }
.foot p { margin: 0; font: 400 20px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; }
.replay {
  margin-top: 6px; cursor: pointer; background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--muted);
  font: 500 11px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; padding: 10px 16px 9px;
}
.replay:hover { color: var(--accent); border-color: var(--accent); }

@media (max-width: 420px) {
  .item { grid-template-columns: 56px minmax(0, 1fr) auto; gap: 4px 10px; }
  .item-art { width: 56px; height: 56px; border-radius: 12px; }
  .item-art svg { width: 48px; height: 50px; }
  .item h3 { font-size: 21px; }
  .price b { font-size: 22px; }
}
@media (min-width: 700px) {
  .mark.mini { display: block; }
  .rail-row { gap: 16px; }
}
@media (min-width: 860px) {
  .items { grid-template-columns: 1fr 1fr; }
  .cat { padding-top: 72px; }
}
@media (prefers-reduced-motion: reduce) {
  .splash { display: none; }
  .reveal, .hero img { animation: none; }
  .track { animation: none; }
  .replay { display: none; }
  html.is-splash { overflow: auto; }
}
</style>

    blended: '<path d="M14 26a18 14 0 0 1 36 0z"/><path d="M16 26h32l-4 30H20z"/><path class="s" d="M20 38c4-3 8 3 12 0s8 3 12 0"/><path class="s" d="M21 46c4-3 8 3 11 0s8 3 11 0"/><path class="s" stroke-width="3.6" d="M39 4l-5 14"/>',
    chocolate: '<path d="M12 28h30v12c0 8-6 14-14 14h-2c-8 0-14-6-14-14z"/><path d="M42 32h3a5.5 5.5 0 0 1 0 11h-3"/><rect class="a" x="16" y="17" width="11" height="10" rx="3"/><rect x="28" y="19" width="11" height="8" rx="3"/><path class="s" d="M17 38c3-2 5 2 8 0s5 2 8 0"/><path d="M8 58h38"/>',
    additions: '<rect x="27" y="3" width="10" height="5" rx="1.5"/><path d="M28 8v6l-6 8v32a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V22l-6-8V8"/><rect class="a" x="26" y="30" width="12" height="14" rx="2"/><path class="k" d="M32 34v6M29 37h6"/>',
    smoothies: '<path d="M16 18h32v30a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10z"/><path class="a" d="M16 30h32v18a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10z"/><path class="s" stroke-width="3.6" d="M25 3l6 21"/><circle class="b" cx="49" cy="19" r="7"/><path d="M49 12v14M43 16l12 6M43 22l12-6"/>',
    refreshers: '<path d="M18 22h28l-2 32a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3z"/><path class="a" d="M19.4 34h25.2l-.6 20a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3z"/><circle cx="28" cy="48" r="2"/><circle cx="36" cy="41" r="2.4"/><circle cx="30" cy="33" r="1.8" class="b"/><circle cx="37" cy="50" r="1.6"/><path d="M30 22c-4-5-2-11 3-13 3 5 1 11-3 13z"/><path d="M37 22c1-5 6-8 11-6-1 6-6 8-11 6z"/><circle class="b" cx="15" cy="23" r="6"/><path d="M15 17v12M9 20l12 6M9 26l12-6"/>',
    default: '<circle cx="32" cy="34" r="17"/><circle class="a" cx="32" cy="34" r="9"/><path d="M6 14v10a4 4 0 0 0 8 0V14M10 14v38"/><path d="M58 14c-4 3-5 12 0 18v20"/>',
    parathah: '<g transform="rotate(-16 32 38)"><rect x="6" y="28" width="46" height="20" rx="10"/><ellipse class="a" cx="50" cy="38" rx="5" ry="10"/><path d="M50 34a2.4 2.4 0 1 1 0 4.8"/><path d="M15 31c2 4 2 10 0 14M24 30c2 4 2 12 0 16"/></g><path d="M22 6c-3 3 3 5 0 8"/><path d="M32 4c-3 3 3 5 0 8"/>'
  };
  function icon(id) { return '<svg class="ic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + (ICONS[id] || ICONS.default) + '</svg>'; }
  function itemArt(category, name) {
    var n = String(name || '').toLowerCase(), c = String(category || '').toLowerCase();
    var fruit = /strawberry|berry|blueberry|cherry|mango|passion|kiwi|pineapple|orange|hibiscus|bubble/.test(n);
    var green = /pistachio|matcha|mint|kiwi|coconut|oat|almond/.test(n);
    var chocolate = /mocha|chocolate|cookies|marshmallow|nutella|cocoa/.test(n);
    var caramel = /caramel|honey|dates|date|saffron|spice|ginger|cardamom/.test(n);
    var berry = /strawberry|berry|blueberry|cherry|hibiscus/.test(n);
    var flavor = green ? 'green' : berry ? 'berry' : chocolate ? 'choc' : caramel ? 'gold' : 'plain';
    var garnish = green ? '<path class="green-fill" d="M15 18c3-5 8-5 11 0-2 5-8 6-11 0z"/><path class="green-stroke" d="M18 15c1 2 1 4 0 6"/>' :
      berry ? '<circle class="berry-fill" cx="16" cy="18" r="3.2"/><circle class="berry-fill" cx="27" cy="16" r="3.2"/><path class="berry-stroke" d="M15 13c3-4 7-3 9-1"/>' :
      chocolate ? '<path class="choc-fill" d="M14 17h22v7H14z"/><path class="choc-stroke" d="M20 18v5M27 18v5M34 18v5"/>' :
      caramel ? '<path class="gold-stroke" d="M14 19c5-7 15 6 23-2M17 23c4-4 10 4 16 0"/>' :
      '<circle class="cream-fill" cx="18" cy="18" r="2.8"/><circle class="cream-fill" cx="29" cy="17" r="2.8"/>';
    var steam = '<path class="steam-stroke" d="M19 13c-4-5 4-7 0-12M28 13c-4-5 4-7 0-12"/>';
    var body;
    if (/parathah/.test(c) || /bikini|lava|cheddar|turkey|pastirma|kiri|nutella hug|pistachio dream/.test(n)) {
      body = '<ellipse class="plate" cx="29" cy="39" rx="24" ry="10"/><path class="food-fill ' + flavor + '" d="M8 35c6-8 17-10 27-7 7 2 12 5 16 10-7 5-17 7-27 5-7-1-12-4-16-8z"/><path class="food-line" d="M15 34c4 3 4 8 1 11M25 31c4 4 4 9 1 13M35 33c3 3 3 7 1 11"/><path class="steam-stroke" d="M22 22c-3-4 3-6 0-10M31 21c-3-4 3-6 0-10"/>';
    } else if (/filter/.test(c) || /v60|aeropress/.test(n)) {
      body = '<path class="filter-paper" d="M8 11h40L32 32H24z"/><path class="filter-line" d="M16 11l8 21M28 11v21M40 11l-8 21"/><path class="coffee-fill" d="M20 32h16v14c0 8-4 12-8 12s-8-4-8-12z"/><path class="coffee-line" d="M20 40h16"/>' + garnish;
    } else if (/matcha/.test(c)) {
      body = '<path class="bowl" d="M6 29h46c-1 14-10 23-23 23S7 43 6 29z"/><ellipse class="green-fill" cx="29" cy="29" rx="23" ry="5"/><path class="green-stroke" d="M23 52v5h13v-5M29 25c-1-7-5-11-11-13 0 8 5 12 11 13z"/><path class="green-stroke" d="M30 27c5-5 8-9 9-14"/>' + garnish;
    } else if (/smoothie|blended/.test(c)) {
      body = '<path class="glass" d="M12 17h34l-3 38c0 5-5 8-14 8s-14-3-14-8z"/><path class="drink-fill ' + flavor + '" d="M13 34h32l-2 21c0 5-5 8-14 8s-14-3-14-8z"/><path class="straw" d="M23 4l8 30"/><path class="fruit-line" d="M18 40c5-4 9 4 14 0s8 4 13 0M18 49c5-4 9 4 14 0s8 4 13 0"/>' + garnish;
    } else if (/ice|refreshers/.test(c)) {
      body = '<path class="glass" d="M11 16h36l-4 45H15z"/><path class="drink-fill ' + flavor + '" d="M13 35h32l-2 26H15z"/><path class="ice" d="M17 22l8 8M29 21l8 8M35 27l-8 8"/><path class="straw" d="M39 3l-6 25"/><circle class="bubble" cx="21" cy="50" r="2"/><circle class="bubble" cx="31" cy="44" r="2.5"/><circle class="bubble" cx="39" cy="53" r="1.8"/>' + garnish;
    } else if (/additions/.test(c)) {
      body = '<path class="bottle" d="M23 6h11v8l5 7v37H18V21l5-7z"/><path class="drink-fill gold" d="M19 32h18v26H19z"/><path class="label" d="M21 35h14v12H21z"/><path class="label-line" d="M24 39h8M24 43h8"/>';
    } else {
      body = '<path class="cup" d="M9 27h36v14c0 10-7 17-18 17S9 51 9 41z"/><path class="coffee-fill" d="M10 33h34v8c0 10-7 17-17 17s-17-7-17-17z"/><path class="handle" d="M45 31h4a7 7 0 0 1 0 14h-5"/><path class="foam" d="M14 31c5-5 10 2 15-1s9 3 14 0"/>' + steam + garnish;
    }
    return '<span class="item-art" aria-hidden="true"><svg viewBox="0 0 58 68" focusable="false"><style>.steam-stroke,.straw{stroke:var(--accent);fill:none;stroke-width:2.2}.green-fill{fill:#a8c76b;stroke:#d8e7a4}.green-stroke{stroke:#d8e7a4;fill:none}.berry-fill{fill:#d86a69;stroke:#ffb08c}.berry-stroke{stroke:#ffb08c;fill:none}.choc-fill{fill:#8b5b48;stroke:#c99472}.choc-stroke{stroke:#25150f}.gold-stroke{stroke:#f5c66b;fill:none}.cream-fill{fill:#f1dfbb;stroke:#fff1d4}.plate,.bowl{fill:var(--bg);stroke:currentColor}.glass,.cup,.handle,.bottle{fill:none;stroke:currentColor}.filter-paper{fill:#f6f2ea;stroke:currentColor}.filter-line,.coffee-line,.food-line,.fruit-line,.label-line{fill:none;stroke:var(--accent-ink);stroke-width:1.4}.coffee-fill{fill:#a86f3e;stroke:#f2c477}.foam{fill:#f6f2ea;stroke:#d5b47b}.drink-fill{stroke:#f6f2ea;stroke-width:1.4}.drink-fill.green{fill:#879f54}.drink-fill.berry{fill:#a94e56}.drink-fill.choc{fill:#754938}.drink-fill.gold{fill:#d29a42}.drink-fill.plain{fill:#ba824b}.ice{fill:rgba(246,242,234,.32);stroke:#f6f2ea}.bubble{fill:var(--accent);stroke:none}.label{fill:var(--accent);stroke:none}.food-fill{stroke:#f6f2ea}.food-fill.green{fill:#91a95a}.food-fill.berry{fill:#b45d54}.food-fill.choc{fill:#6e4435}.food-fill.gold{fill:#d5a64e}.food-fill.plain{fill:#d0a15c}</style>' + body + '</svg></span>';
  }

  var menuEl = $('#menu'), chipsEl = $('#chips'), rail = $('#rail'), emptyEl = $('#empty');
  var sections = [];

  function build(menu) {
    menuEl.innerHTML = ''; chipsEl.innerHTML = ''; sections.length = 0; current = null;
    menu.forEach(function (c) {
      var sid = 'cat-' + String(c.id).replace(/[^a-zA-Z0-9_-]/g, '');
      var key = c.icon || c.id;
      var sec = document.createElement('section');
      sec.className = 'cat'; sec.id = sid; sec.setAttribute('aria-labelledby', sid + '-h');
      sec.innerHTML = '<header class="cat-h"><div class="ttl">' + icon(key) +
        '<h2 id="' + sid + '-h">' + esc(c.name) + '</h2></div><span class="cat-n"></span></header>' +
        (c.sub ? '<p class="sub">' + esc(c.sub) + '</p>' : '') + '<ul class="items"></ul>';
      var ul = $('.items', sec), lis = [];
      c.items.forEach(function (it) {
        var li = document.createElement('li');
        var off = it[4] === false;
        li.className = 'item' + (off ? ' off' : '');
        li.dataset.s = (it[0] + ' ' + (it[2] || '') + ' ' + (it[3] || '') + ' ' + c.name).toLowerCase();
        li.innerHTML = itemArt(c.id, it[0]) + '<div class="info"><h3><span>' + esc(it[0]) + '</span>' + (it[2] ? '<span class="note">' + esc(it[2]) + '</span>' : '') +
          (off ? '<span class="note off-tag">Sold out</span>' : '') + '</h3>' +
          (it[3] ? '<p>' + esc(it[3]) + '</p>' : '') + '</div><div class="price">' + priceHTML(it[1]) + '</div>';
        ul.appendChild(li); lis.push(li);
      });
      menuEl.appendChild(sec);

      var chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'chip'; chip.innerHTML = icon(key) + '<span>' + esc(c.name) + '</span>';
      chip.addEventListener('click', function () {
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        sec.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
      chipsEl.appendChild(chip);
      sections.push({ el: sec, chip: chip, lis: lis, count: $('.cat-n', sec) });
    });
    filter();
  }

  function filter() {
    var input = $('#q'), v = input ? input.value.trim().toLowerCase() : '', found = 0;
    sections.forEach(function (sec) {
      var shown = 0;
      sec.lis.forEach(function (li) {
        var ok = !v || li.dataset.s.indexOf(v) > -1;
        li.hidden = !ok;
        if (ok) shown++;
      });
      sec.el.hidden = shown === 0;
      sec.count.textContent = shown + (shown === 1 ? ' item' : ' items');
      if (shown) found++;
    });
    if (emptyEl) {
      emptyEl.hidden = found !== 0;
      var qt = $('#qtext'); if (qt) qt.textContent = v ? '“' + v + '”' : '';
    }
  }
  var qInput = $('#q'), searchButton = $('#sbtn');
  if (qInput) qInput.addEventListener('input', filter);
  if (searchButton) searchButton.addEventListener('click', function () {
    var open = rail.classList.toggle('searching');
    searchButton.setAttribute('aria-expanded', String(open));
    if (open && qInput) qInput.focus();
  });
  var clearButton = $('#clear');
  if (clearButton) clearButton.addEventListener('click', function () { if (qInput) { qInput.value = ''; filter(); qInput.focus(); } });
  // Data: Supabase when configured, otherwise the starter menu. The last good copy is cached for offline visits.
  function configured() { return CFG.supabaseUrl && CFG.anonKey && String(CFG.supabaseUrl).indexOf('YOUR-PROJECT') < 0; }
  function api(path) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
    return fetch(String(CFG.supabaseUrl).replace(/\/$/, '') + '/rest/v1/' + path, {
      headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + CFG.anonKey }, signal: ctl ? ctl.signal : undefined
    }).then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function rowsToMenu(cats, items) {
    var enabledCats = cats.filter(function (c) { return c.available !== false; });
    var by = {};
    enabledCats.forEach(function (c) { by[c.id] = { id: c.id, name: c.name, sub: c.sub || '', icon: c.icon || c.id, items: [] }; });
    items.forEach(function (r) {
      if (r.available === false) return;
      var c = by[r.category_id]; if (!c) return;
      var pr = Array.isArray(r.prices) ? r.prices : [];
      var price = (pr.length === 1 && !pr[0].label) ? pr[0].price : pr.map(function (x) { return [x.label, x.price]; });
      c.items.push([r.name, price, r.note || '', r.description || '', true]);
    });
    return enabledCats.map(function (c) { return by[c.id]; }).filter(function (c) { return c.items.length; });
  }
  function cached() { try { var v = JSON.parse(localStorage.getItem(CACHE_KEY)); return v && v.length ? v : null; } catch (e) { return null; } }
  function remember(m) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(m)); } catch (e) {} }
  function load() {
    // Read the admin-controlled menu first; keep the embedded menu as a safe fallback.
    if (!configured()) { build(STARTER); return; }
    Promise.all([
      api('categories?select=*&order=position.asc'),
      api('items?select=*&order=position.asc')
    ]).then(function (data) {
      var menu = rowsToMenu(data[0], data[1]);
      build(menu.length ? menu : STARTER);
      if (menu.length) remember(menu);
    }).catch(function () {
      var old = cached(); build(old || STARTER);
    });
  }
  load();

  // Ticker
  var grp = '';
  for (var i = 0; i < 8; i++) grp += '<span>Curio</span><i></i><span>Everyone’s Happy Place</span><i></i>';
  $('#track').innerHTML = grp + grp;

  // Footer reuses the intro illustration
  var art = $('#art'), fimg = $('#fimg');
  if (art && fimg) fimg.src = art.src; else if (fimg) fimg.hidden = true;
})();
</script>
